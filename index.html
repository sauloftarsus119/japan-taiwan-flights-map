function arcPoints(a, b, k, n=48){
  // 以近似 Web Mercator 平面座標計算二次貝茲曲線，避免高緯度變形
  const P = p => [p[1], Math.log(Math.tan(Math.PI/4 + p[0]*Math.PI/360))*180/Math.PI];
  const U = q => [ (2*Math.atan(Math.exp(q[1]*Math.PI/180)) - Math.PI/2)*180/Math.PI, q[0] ];
  const A=P(a), B=P(b);
  const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, dx=B[0]-A[0], dy=B[1]-A[1];
  const C=[mx - dy*k, my + dx*k];
  const pts=[];
  for(let i=0;i<=n;i++){ const t=i/n, u=1-t;
    pts.push(U([u*u*A[0]+2*u*t*C[0]+t*t*B[0], u*u*A[1]+2*u*t*C[1]+t*t*B[1]])); }
  return pts;
}

// 為同一台灣機場出發的航線依方位角給予細微曲率差異（扇形展開）
function computeCurvatures(){
  TW_ORDER.forEach(tw=>{
    const rs = ROUTES.filter(r=>r.tw===tw);
    rs.forEach(r=>{ const j=JP[r.jp], t=TW[tw]; r.bearing=Math.atan2(j.lat-t.lat, j.lng-t.lng); r.dist=Math.hypot(j.lat-t.lat,j.lng-t.lng); });
    const sorted=[...rs].sort((a,b)=>a.bearing-b.bearing);
    sorted.forEach((r,i)=>{
      // 依方位角排序後，由 -0.5 到 +0.5 分配：偏東者向東南彎、偏北者向西北彎，放大起點處的角度差，形成扇形
      const spread = sorted.length>1 ? (i/(sorted.length-1)-0.5) : 0;
      let k = TW[tw].k + spread*SPREAD[tw];
      if (r.dist < 4) k = (k>=0? 1:-1) * Math.max(Math.abs(k),0.25) * 1.3; // 近距離（沖繩、石垣）加大弧度以利辨識
      r.k = k;
    });
  });
}

  }).addTo(map);
  base.on("tileerror", ()=>{ if(++tileErr>4 && !switched){ switched=true; map.removeLayer(base);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'&copy; OpenStreetMap 貢獻者', maxZoom:12, className:"osm-faded"}).addTo(map);} });
  map.createPane("routes"); map.getPane("routes").style.zIndex=410;
  map.createPane("hit"); map.getPane("hit").style.zIndex=420;
  map.createPane("apts"); map.getPane("apts").style.zIndex=630;

  computeCurvatures();
  ROUTES.forEach(r=>{
    const t=TW[r.tw], j=JP[r.jp];
    const pts = arcPoints([t.lat,t.lng],[j.lat,j.lng], r.k);
    const line = L.polyline(pts, Object.assign({pane:"routes", interactive:false}, baseStyle(r))).addTo(map);
    const hit = L.polyline(pts, {pane:"hit", color:"#000", opacity:0, weight:11}).addTo(map);
    hit.bindTooltip(()=>routeTip(r), {sticky:true, className:"route-tip", direction:"top", opacity:0.96});
    hit.on("mouseover", ()=>{ highlight([r.id], {jp:[r.jp], tw:[r.tw]}); scrollToRow(r.id); });
    hit.on("mouseout", clearHighlight);
    routeLayers[r.id]={line, hit};
  });

  // 機場標記
  const usedJp = new Set(ROUTES.map(r=>r.jp));
  Object.entries(JP).forEach(([code,a])=>{
    if(!usedJp.has(code)) return;
    const m = L.circleMarker([a.lat,a.lng], {pane:"apts", radius:5, color:"#fff", weight:1.5, fillColor:"#0b6e75", fillOpacity:1}).addTo(map);
    m.bindTooltip(`${a.name} <span style="color:#777">${code}</span>`, {permanent:true, direction:a.lab||"right", className:"apt-label", offset: offsetFor(a.lab)});
    m.on("mouseover", ()=>{ const ids=ROUTES.filter(r=>r.jp===code && twVisible(r.tw)).map(r=>r.id);
      highlight(ids, {jp:[code], tw:[...new Set(ids.map(i=>ROUTES[i].tw))]}); if(ids.length) scrollToRow(ids[0]); });
    m.on("mouseout", clearHighlight);
    m.bindPopup(()=>aptPopup(code));
    jpMarkers[code]=m;
  });
  Object.entries(TW).forEach(([code,a])=>{
    const m = L.circleMarker([a.lat,a.lng], {pane:"apts", radius:8, color:"#fff", weight:2, fillColor:a.color, fillOpacity:1}).addTo(map);
    m.bindTooltip(`${a.name} <span style="color:#777">${code}</span>`, {permanent:true, direction:a.lab, className:"apt-label tw", offset: offsetFor(a.lab, 9)});
    m.on("mouseover", ()=>{ if(!twVisible(code)) return; const ids=ROUTES.filter(r=>r.tw===code).map(r=>r.id);
      highlight(ids, {tw:[code], jp:[...new Set(ids.map(i=>ROUTES[i].jp))]}); });
    m.on("mouseout", clearHighlight);
    twMarkers[code]=m;
  });

  // 圖例
  const legend = L.control({position:"topleft"});
  legend.onAdd = ()=>{ const d=L.DomUtil.create("div","legend");
    d.innerHTML = "<b>圖例（依台灣出發機場上色）</b><br>" +
      TW_ORDER.map(c=>`<span class="ln" style="border-color:${TW[c].color}"></span>${TW[c].name} ${c}`).join("<br>") +
      `<br><span class="ln dash" style="border-color:#777"></span>期間限定／待確認航線` +
      `<br><span class="sw" style="background:#0b6e75;width:10px;height:10px"></span> 日本機場　<span class="sw" style="background:#d62728;width:12px;height:12px"></span> 台灣機場`;
    return d; };
  legend.addTo(map);
  fitAll();
}
function offsetFor(dir, r=6){ return dir==="left"?[-r,0]:dir==="right"?[r,0]:dir==="top"?[0,-r]:[0,r]; }
function fitAll(){ const pts=[...Object.values(JP),...Object.values(TW)].map(a=>[a.lat,a.lng]); map.fitBounds(pts,{paddingTopLeft:[30,30], paddingBottomRight:[30,40]}); }

function routeTip(r){
  const t=TW[r.tw], j=JP[r.jp];
  return `<b>${t.name} ${r.tw}</b> ⇄ <b>${j.name} ${r.jp}</b><br>` +
    `<span style="color:#666">${j.region}</span> ${tagHTML(r)}<br>` +
    `航空公司（${r.nAir}）：${airlineHTML(r)}` + (r.note? `<br><span style="color:#555">※ ${r.note}</span>`:"");
}
function aptPopup(code){
  const rs=ROUTES.filter(r=>r.jp===code);
  return `<b>${JP[code].name} ${code}</b>（${JP[code].region}）<br>` + rs.map(r=>`<span class="tw-dot" style="background:${TW[r.tw].color}"></span>${TW[r.tw].short}：${r.airlines.map(a=>AL[a.c]).join("、")}`).join("<br>");
}

function twVisible(tw){ return document.querySelector(`input[data-tw="${tw}"]`).checked; }

function highlight(ids, apts){
  hlState = {ids, apts};
  const set = new Set(ids);
  if (map){
    ROUTES.forEach(r=>{
      const L1 = routeLayers[r.id].line;
      if (!twVisible(r.tw)) return;
      if (set.has(r.id)) { L1.setStyle({weight:5, opacity:1, color:TW[r.tw].color, dashArray:null}); L1.bringToFront(); }
      else L1.setStyle({opacity:0.07, weight:1.5});
    });
    Object.entries(jpMarkers).forEach(([c,m])=>{ const on=apts.jp&&apts.jp.includes(c);
      m.setStyle(on?{radius:8, fillColor:"#e60000", color:"#fff"}:{radius:5, fillColor:"#0b6e75"});
      const el=m.getTooltip()&&m.getTooltip().getElement(); if(el) el.classList.toggle("hl", !!on); });
    Object.entries(twMarkers).forEach(([c,m])=>{ const on=apts.tw&&apts.tw.includes(c);
      m.setStyle(on?{radius:11, weight:3, color:"#222"}:{radius:8, weight:2, color:"#fff"});
      const el=m.getTooltip()&&m.getTooltip().getElement(); if(el) el.classList.toggle("hl", !!on); });
  }
  document.querySelectorAll("tr.route").forEach(tr=>tr.classList.toggle("hl", set.has(+tr.dataset.id)));
}
function clearHighlight(){
  hlState=null;
  if (map){
    ROUTES.forEach(r=>{ if(twVisible(r.tw)) routeLayers[r.id].line.setStyle(baseStyle(r)); });
    Object.values(jpMarkers).forEach(m=>{ m.setStyle({radius:5, fillColor:"#0b6e75", color:"#fff"}); const el=m.getTooltip()&&m.getTooltip().getElement(); if(el) el.classList.remove("hl"); });
    Object.entries(twMarkers).forEach(([c,m])=>{ m.setStyle({radius:8, weight:2, color:"#fff"}); const el=m.getTooltip()&&m.getTooltip().getElement(); if(el) el.classList.remove("hl"); });
  }
  document.querySelectorAll("tr.route.hl").forEach(tr=>tr.classList.remove("hl"));
}
function scrollToRow(id){
  const tr=document.querySelector(`tr.route[data-id="${id}"]`); if(!tr||tr.classList.contains("hidden")) return;
  const wrap=document.getElementById("tablewrap"); const r=tr.getBoundingClientRect(), w=wrap.getBoundingClientRect();
  if (r.top < w.top+60 || r.bottom > w.bottom) wrap.scrollTop += (r.top - w.top) - w.height/3;
}

// ===================== 表格 =====================
let sortKey="jp", sortDir=1;
function regionIdx(r){ return REGIONS.indexOf(r.region); }
function jpOrder(code){ return Object.keys(JP).indexOf(code); }
function cmp(a,b){
  let v=0;
  if (sortKey==="jp") v = regionIdx(a)-regionIdx(b) || jpOrder(a.jp)-jpOrder(b.jp) || TW_ORDER.indexOf(a.tw)-TW_ORDER.indexOf(b.tw);
  else if (sortKey==="tw") v = TW_ORDER.indexOf(a.tw)-TW_ORDER.indexOf(b.tw) || regionIdx(a)-regionIdx(b) || jpOrder(a.jp)-jpOrder(b.jp);
  else if (sortKey==="nAir") v = a.nAir-b.nAir || regionIdx(a)-regionIdx(b);
  else if (sortKey==="note") v = (b.tags.length+(b.note?1:0)) - (a.tags.length+(a.note?1:0)) || regionIdx(a)-regionIdx(b);
  return v*sortDir;
}
function renderTable(){
  const gb=document.getElementById("groupBy").value;
  const tb=document.querySelector("#tbl tbody"); tb.innerHTML="";
  let rows=[...ROUTES];
  if (gb==="region") rows.sort((a,b)=> regionIdx(a)-regionIdx(b) || cmp(a,b));
  else if (gb==="tw") rows.sort((a,b)=> TW_ORDER.indexOf(a.tw)-TW_ORDER.indexOf(b.tw) || cmp(a,b));
  else rows.sort(cmp);
  let lastG=null;
  rows.forEach(r=>{
    const g = gb==="region"? r.region : gb==="tw"? r.tw : null;
    if (g!==null && g!==lastG){
      const cnt = rows.filter(x=>(gb==="region"?x.region:x.tw)===g).length;
      const tr=document.createElement("tr"); tr.className="grp"; tr.dataset.g=g;
      tr.innerHTML = `<td colspan="4">${gb==="tw"? `<span class="tw-dot" style="background:${TW[g].color}"></span>${TW[g].name} ${g}` : g}　<span style="font-weight:normal;color:#678">（<span class="gc">${cnt}</span> 條）</span></td>`;
      tb.appendChild(tr); lastG=g;
    }
    const j=JP[r.jp], t=TW[r.tw];
    const tr=document.createElement("tr"); tr.className="route"; tr.dataset.id=r.id; tr.dataset.tw=r.tw; tr.dataset.g=g;
    tr.innerHTML = `<td><b>${j.name}</b> <span class="code">${r.jp}</span><br><span style="color:#888;font-size:11px">${j.region}</span></td>`+
      `<td style="white-space:nowrap"><span class="tw-dot" style="background:${t.color}"></span>${t.short} <span class="code">${r.tw}</span></td>`+
      `<td>${airlineHTML(r)}</td>`+
      `<td>${tagHTML(r)}${r.note? `<div style="color:#555;font-size:11.5px">${r.note}</div>`:""}</td>`;
    tr.addEventListener("mouseenter", ()=>{ highlight([r.id], {jp:[r.jp], tw:[r.tw]}); });
    tr.addEventListener("mouseleave", clearHighlight);
    tr.addEventListener("click", ()=>{ if(map) map.fitBounds(L.latLngBounds([[t.lat,t.lng],[j.lat,j.lng]]).pad(0.25)); });
    tb.appendChild(tr);
  });
  document.querySelectorAll("thead th").forEach(th=>th.querySelector(".arrow").textContent = th.dataset.k===sortKey? (sortDir>0?"▲":"▼") : "");
  applyFilter();
}
function applyFilter(){
  const vis = new Set(TW_ORDER.filter(twVisible));
  document.querySelectorAll("tr.route").forEach(tr=>tr.classList.toggle("hidden", !vis.has(tr.dataset.tw)));
  document.querySelectorAll("tr.grp").forEach(g=>{
    const n=[...document.querySelectorAll(`tr.route[data-g="${CSS.escape(g.dataset.g)}"]`)].filter(tr=>!tr.classList.contains("hidden")).length;
    g.querySelector(".gc").textContent=n; g.classList.toggle("hidden", n===0);
  });
  if (map){
    ROUTES.forEach(r=>{ const on=vis.has(r.tw); const {line,hit}=routeLayers[r.id];
      if(on){ if(!map.hasLayer(line)){line.addTo(map);hit.addTo(map);} line.setStyle(baseStyle(r)); }
      else { line.remove(); hit.remove(); } });
    const jpOn = new Set(ROUTES.filter(r=>vis.has(r.tw)).map(r=>r.jp));
    Object.entries(jpMarkers).forEach(([c,m])=>{ if(jpOn.has(c)){ if(!map.hasLayer(m)) m.addTo(map);} else m.remove(); });
    Object.entries(twMarkers).forEach(([c,m])=>{ m.setStyle({fillOpacity: vis.has(c)?1:0.25}); });
  }
  const shown = ROUTES.filter(r=>vis.has(r.tw));
  document.getElementById("nRoutes").textContent = shown.length + (shown.length!==ROUTES.length? ` / ${ROUTES.length}`:"");
  document.getElementById("nJp").textContent = new Set(shown.map(r=>r.jp)).size;
}

// 篩選器
document.getElementById("twFilters").innerHTML = TW_ORDER.map(c=>{
  const n=ROUTES.filter(r=>r.tw===c).length;
  return `<label class="tw"><input type="checkbox" data-tw="${c}" checked><span class="sw" style="background:${TW[c].color}"></span>${TW[c].short} ${c}（${n}）</label>`; }).join("") +
  ` <a href="#" id="allOn" style="font-size:12px">全選</a>`;
document.querySelectorAll("#twFilters input").forEach(i=>i.addEventListener("change", applyFilter));
document.getElementById("allOn").addEventListener("click", e=>{ e.preventDefault(); document.querySelectorAll("#twFilters input").forEach(i=>i.checked=true); applyFilter(); });
document.getElementById("groupBy").addEventListener("change", renderTable);
document.querySelectorAll("thead th").forEach(th=>th.addEventListener("click", ()=>{
  const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; }
  if (k==="jp" || k==="tw") document.getElementById("groupBy").value = (k==="jp"?"region":"tw");
  if (k==="nAir" || k==="note") document.getElementById("groupBy").value = "none";
  renderTable(); }));
document.getElementById("showLabels").addEventListener("change", e=>{
  document.querySelectorAll(".apt-label").forEach(el=>el.style.display = e.target.checked? "":"none"); });

// 註腳
document.getElementById("foot").innerHTML =
  `<b>說明：</b>僅收錄 2026/10/2 時點有證據顯示正在經營（或本季班表內）之直飛定期客運航線；純包機不列入。「5th」＝第三國航空公司以第五航權經營（如曼谷／新加坡／香港／吉隆坡經台灣續飛日本），同樣為台日間不經停航段。班次及季節變動頻繁，請以各航空公司官網為準。<br>`+
  `<b>即將開航（未繪製或僅註記）：</b>${UPCOMING.join("；")}<br>`+
  `<b>已停飛／未列入：</b>${SUSPENDED.join("；")}<br>`+
  `<b>主要資料來源：</b>英文維基百科各機場「Airlines and destinations」（桃園、松山、臺中、高雄、臺南及日本各機場頁面，2026/9 版）；`+
  `<a href="https://www.cna.com.tw/news/ahel/202604100054.aspx" target="_blank">中央社：台灣虎航冬季班表</a>、`+
  `<a href="https://udn.com/news/story/7270/9442328" target="_blank">聯合報：虎航冬季航線</a>、`+
  `<a href="https://www.caa.gov.tw/" target="_blank">民航局新聞稿（台南—熊本／沖繩首航，2025/12/23）</a>、`+
  `<a href="https://www.ttnmedia.com/?p=142510" target="_blank">旅報：虎航高雄—石垣、小松首航</a>、`+
  `<a href="https://dannypingu.com/2026/08/25/taichung-to-japan-direct-flights/" target="_blank">台中直飛日本整理（2026/9/26 查核）</a>、`+
  `<a href="https://ajunfun.tw/taiwan-japan-flights/" target="_blank">2026 下半年台日航線變化</a>、`+
  `<a href="https://www.flypeach.com/en/lm/st/w_schedule" target="_blank">Peach 2026 冬季班表</a>、`+
  `<a href="https://www.ibaraki-airport.net/post-251010131419/" target="_blank">茨城機場停飛公告</a>、`+
  `<a href="https://www.nikkei.com/article/DGXZQOFC2712R0X20C26A3000000/" target="_blank">日經：旭川—台北停飛</a>、`+
  `<a href="https://newsroom.airasia.com/news/airasia-reaffirms-commitment-to-kota-kinabalu-connectivity-with-new-route-to-fukuoka-via-taipei" target="_blank">AirAsia 亞庇—台北—福岡</a>、`+
  `<a href="https://www.sabretn.com.tw/admin/fileupload/134290814067473636260721JL1.pdf" target="_blank">日航大阪—台北加班機公告</a>。<br>`+
  `底圖：© Esri Light Gray Canvas（備援：© OpenStreetMap 貢獻者）。製作日期：2026/10/2。`;

if (hasMap) { try { initMap(); } catch(e){ console.error(e); } }
else { document.getElementById("fallback").style.display="block"; }
renderTable();
</script>
